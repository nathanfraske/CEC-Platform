[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cec-pcb-pipeline"
version = "0.2.0"
description = "Frontier-directed native PCB construction with independent receiving"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.scripts]
cec-pcb = "cec_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cec_pipeline*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
