#
# CI for the CEC platform. Runs on the host runner and invokes kicad-cli through
# the repo's wrapper (scripts/kicad-cli.sh), which pulls the pinned KiCad Docker
# image on demand (KICAD_IMAGE in versions.env, default kicad/kicad:10.0). The
# repo-hygiene checklist needs no KiCad. The ERC/DRC sweep skips boards with no
# placed parts, so a skeleton repo stays green until real schematics/layouts land.
#
# (Running on the host — rather than inside the KiCad image as a container job —
# avoids the checkout/runtime friction of CI on an image not built for it, and
# only pulls the heavy image when a board actually needs checking.)
name: KiCad checks

on:
  push:
    # firmware/** has its own workflow (firmware-ci.yml); a firmware push
    # never rebuilds the KiCad gates and vice versa.
    paths-ignore: ['firmware/**']
  pull_request:
    paths-ignore: ['firmware/**']
  workflow_dispatch:

jobs:
  kicad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repo hygiene checklist
        run: ./scripts/checklist.sh

      - name: ERC + DRC sweep (kicad-cli via Docker)
        run: ./scripts/check-all.sh

      # CL-11 golden fixture invariants (flag-ID anchors): known-bad fires the expected
      # check IDs, known-good fires none. Needs pcbnew, so it runs INSIDE the pinned KiCad
      # image (the same image the kicad-cli wrapper pulls). Blocking by the framework rule
      # for changes to scripts/, cec-policy.json, corpus/promoted/ -- run unconditionally
      # (it is cheap) so drift is caught everywhere.
      - name: Golden fixture invariants (CL-11, pcbnew via Docker)
        run: |
          . ./versions.env
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":"$PWD" -w "$PWD" \
            --entrypoint python3 \
            "${KICAD_IMAGE:-kicad/kicad:10.0}" \
            scripts/cec_golden_fixtures.py

      # CL-03 R8 container leg: AM-02 fixture validation for promoted corpus
      # entries (the compile-time blocking latch reads its results). Vacuously
      # green while corpus/promoted/ is empty; load-bearing at first promotion.
      # The CL-03 wave tests themselves are host-runnable (compiler is
      # pcbnew-free) and run with the checklist above via unittest here.
      - name: Corpus fixture validation + CL-03 wave tests
        run: |
          . ./versions.env
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":"$PWD" -w "$PWD" \
            --entrypoint python3 \
            "${KICAD_IMAGE:-kicad/kicad:10.0}" \
            scripts/cec_corpus_compile.py fixtures
          python3 -W ignore -m unittest tests.test_cl03_compiler -v 2>&1 | tail -5
