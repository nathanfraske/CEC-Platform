#
# Run the SYNTHESIS PIPELINE on a SELF-HOSTED runner -- the CPU-heavy compute plane
# (cec_synth_pipeline: placement sweep / route swarm / electrothermal FEA / cascade) on YOUR
# hardware. The LLM control plane (planning/judging/sign-off) stays a remote Claude session;
# this workflow is the deterministic plane only.
#
# Two modes:
#   * run   -- the full pipeline end-to-end on a board (run_pipeline): ERC+BOM gate -> triage ->
#              [existing board, optionally --route via the swarm] -> physics+cascade -> sign-off
#              -> build+freeze. Uploads the release board + frozen decision log.
#   * sweep -- the placement candidate sweep across sizes (the overlap-vs-size surface), bulk on
#              the runner's cores. Uploads the candidates + renders + the synth report.
#
# Same runner as route.yml (label cec-router). Windows uses scripts\synth.ps1 (finds KiCad's
# bundled python -- pcbnew is only importable from it -- no manual PATH config); Linux/macOS run
# cec_synth_pipeline.py directly. Setup + the full prereqs/PATH story: docs/self-hosted-router.md.
# NOTE: workflow_dispatch only works once this file is on the DEFAULT branch (main).
name: Synthesize (self-hosted)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Authoritative BETA board (dir under beta/)"
        type: choice
        default: eps-8pin
        options:
          - eps-8pin
          - eps-8pin-rev3
          - pcie-8pin-2port
          - pcie-8pin-3port
          - 12vhpwr-standard
          - atx-24pin-rev3
          - argb-standard
          - hub-standard-rev2
      mode:
        description: "run = full pipeline | sweep = placement sweep | candidates = route-candidate metrics (agentic loop)"
        type: choice
        default: run
        options:
          - run
          - sweep
          - candidates
      route:
        description: "run mode: route the board via the swarm before physics/cascade"
        type: boolean
        default: false
      routed_board:
        description: "run mode: an existing routed .kicad_pcb to run on (repo-relative; blank = the module floorplan)"
        default: ""
      sizes:
        description: "sweep mode: board sizes 'WxH,WxH' or 'auto'"
        default: "auto"
      seeds:
        description: "comma-separated placement seeds"
        default: "0,1,2,3"
      strategies:
        description: "comma-separated placement strategies"
        default: "dataflow,thermal_separated,compact"
      passes:
        description: "candidates mode: Freerouting passes (-mp)"
        default: "8"
      opt_time:
        description: "candidates mode: Freerouting optimization seconds (-oit)"
        default: "12"
      max_workers:
        description: "parallel candidate workers (0 = auto: min(candidates, CPU threads))"
        default: "0"

jobs:
  synth:
    runs-on: [self-hosted, cec-router]
    timeout-minutes: 180
    env:
      CEC_FREEROUTING_JAR: ${{ vars.CEC_FREEROUTING_JAR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- prerequisites ----
      - name: Verify prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -File "{0}"'
        run: .\scripts\route-prereqs.ps1

      - name: Verify prerequisites (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./scripts/route-prereqs.sh

      # ---- synthesize on the runner's CPU ----
      - name: Synthesize (Windows)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -File "{0}"'
        run: >
          .\scripts\synth.ps1
          -Mode        "${{ inputs.mode }}"
          -Board       "${{ inputs.board }}"
          ${{ inputs.route == true && '-Route' || '' }}
          -RoutedBoard "${{ inputs.routed_board }}"
          -Sizes       "${{ inputs.sizes }}"
          -Seeds       "${{ inputs.seeds }}"
          -Strategies  "${{ inputs.strategies }}"
          -Passes       ${{ inputs.passes }}
          -OptTime      ${{ inputs.opt_time }}
          -MaxWorkers   ${{ inputs.max_workers }}

      - name: Synthesize (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "candidates" ]; then
            python3 scripts/cec_dispatch.py request-candidates --board "${{ inputs.board }}" \
              --seeds "${{ inputs.seeds }}" --passes "${{ inputs.passes }}" \
              --opt-time "${{ inputs.opt_time }}" --max-workers "${{ inputs.max_workers }}" \
              --out "build/candidates/${{ inputs.board }}"
          elif [ "${{ inputs.mode }}" = "sweep" ]; then
            python3 scripts/cec_synth_pipeline.py --board "${{ inputs.board }}" \
              --sweep "${{ inputs.sizes }}" --seeds "${{ inputs.seeds }}" \
              --strategies "${{ inputs.strategies }}" --max-workers "${{ inputs.max_workers }}" \
              --out "build/synth/${{ inputs.board }}"
          else
            ARGS="--run"
            [ -n "${{ inputs.routed_board }}" ] && ARGS="$ARGS --routed-board ${{ inputs.routed_board }}"
            [ "${{ inputs.route }}" = "true" ] && ARGS="$ARGS --route"
            python3 scripts/cec_synth_pipeline.py --board "${{ inputs.board }}" $ARGS \
              --out "build/release/${{ inputs.board }}"
          fi

      # ---- run summary (R-04): surface the verdict on the run page. A run-mode pipeline
      # ending "sign-off withheld" exits 0 BY DESIGN (a completed cautious verdict is a
      # success), so without this step it looks identical to RELEASED. The
      # ===CEC_CANDIDATES_JSON_BEGIN/END=== stdout markers are the ORCHESTRATOR contract
      # and are unchanged; this summary is for humans.
      - name: Run summary (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: |
          {
            echo "## Synth: ${{ inputs.board }} (${{ inputs.mode }})"
            case "${{ inputs.mode }}" in
              candidates)
                CJ="build/candidates/${{ inputs.board }}/candidates.json"
                if [ -f "$CJ" ]; then
                  echo '```json'
                  head -c 60000 "$CJ"   # summary cap is 1 MiB; keep it sane
                  echo; echo '```'
                else
                  echo "_no candidates.json produced_"
                fi ;;
              run)
                LOG="build/release/${{ inputs.board }}/${{ inputs.board }}-decision-log.json"
                if [ -f "$LOG" ]; then
                  python3 - "$LOG" <<'PYEOF'
          import json, sys
          log = json.load(open(sys.argv[1]))
          entries = log if isinstance(log, list) else (log.get("stages") or log.get("entries") or [])
          rel = [e for e in entries if isinstance(e, dict) and e.get("stage") == "release"]
          status = rel[-1].get("status") if rel else "UNKNOWN (no release record)"
          print(f"**Pipeline verdict: {status}**")
          PYEOF
                else
                  echo "_no decision log produced (pipeline failed before freeze)_"
                fi ;;
              sweep)
                RP="build/synth/${{ inputs.board }}/synth-report.json"
                if [ -f "$RP" ]; then
                  echo '```json'
                  head -c 60000 "$RP"
                  echo; echo '```'
                else
                  echo "_no synth-report.json produced_"
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -Command "{0}"'
        run: |
          $board = "${{ inputs.board }}"; $mode = "${{ inputs.mode }}"
          $lines = @("## Synth: $board ($mode)")
          switch ($mode) {
            "candidates" {
              $cj = "build/candidates/$board/candidates.json"
              if (Test-Path $cj) { $lines += '```json'
                $raw = Get-Content $cj -Raw
                $lines += $raw.Substring(0, [Math]::Min(60000, $raw.Length)); $lines += '```' }
              else { $lines += "_no candidates.json produced_" } }
            "run" {
              $log = "build/release/$board/$board-decision-log.json"
              if (Test-Path $log) {
                $entries = Get-Content $log -Raw | ConvertFrom-Json
                if ($entries.stages) { $entries = $entries.stages }
                elseif ($entries.entries) { $entries = $entries.entries }
                $rel = @($entries | Where-Object { $_.stage -eq "release" })
                $status = if ($rel) { $rel[-1].status } else { "UNKNOWN (no release record)" }
                $lines += "**Pipeline verdict: $status**" }
              else { $lines += "_no decision log produced (pipeline failed before freeze)_" } }
            "sweep" {
              $rp = "build/synth/$board/synth-report.json"
              if (Test-Path $rp) { $lines += '```json'
                $raw = Get-Content $rp -Raw
                $lines += $raw.Substring(0, [Math]::Min(60000, $raw.Length)); $lines += '```' }
              else { $lines += "_no synth-report.json produced_" } }
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY

      # ---- collect ----
      - name: Upload synthesis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synth-${{ inputs.board }}-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            build/synth/${{ inputs.board }}/
            build/release/${{ inputs.board }}/
            build/candidates/${{ inputs.board }}/
          if-no-files-found: warn
