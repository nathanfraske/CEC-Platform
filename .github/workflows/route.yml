#
# Automated routing on a SELF-HOSTED runner -- runs the CPU-heavy compute plane
# (Freerouting JVMs + kicad-cli DRC) on YOUR hardware, not a GitHub-hosted box.
#
# The LLM control plane (planning/judging) is NOT here -- it's remote inference in a
# Claude session. This workflow is purely the deterministic plane: generate Freerouting
# candidates, score them against the hard safety gates, run the decision-logged repair
# loop (scripts/cec_router.py), and upload the routed candidate + decision log + render.
#
# Works on a Windows, Linux, or macOS runner (OS-conditional steps below):
#   * Windows: scripts\route.ps1 finds KiCad's bundled python (the only one with pcbnew),
#     puts KiCad bin + java on PATH, and runs the router. No xvfb -- Java uses the native
#     display, so the runner MUST be in an interactive desktop session (see the docs).
#   * Linux/macOS: python3 runs the router directly; headless Linux auto-wraps Freerouting
#     in xvfb-run.
# Runner setup + the FULL prereqs/PATH story: docs/self-hosted-router.md. The runner must
# carry the label `cec-router`.
name: Route (self-hosted)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Module to route (dir under modules/)"
        type: choice
        default: eps-8pin
        options:
          - eps-8pin
          - pcie-8pin-2port
          - pcie-8pin-3port
          - 12vhpwr-standard
          - atx-24pin
      seeds:
        description: "Comma-separated Freerouting param-variant seeds"
        default: "0,1,2,3"
      passes:
        description: "Freerouting routing passes (-mp)"
        default: "10"
      opt_time:
        description: "Freerouting optimization seconds (-oit)"
        default: "20"
      threads:
        description: "Freerouting threads per candidate (-mt)"
        default: "1"
      kmax:
        description: "Repair attempts before an escalation re-plan"
        default: "2"
      max_iters:
        description: "Per-region iteration ceiling"
        default: "4"
      max_workers:
        description: "Parallel Freerouting workers (0 = auto: min(seeds, CPU threads); set higher to oversubscribe)"
        default: "0"
      opt_spread:
        description: "Parallel opt-time SWEEP floor (s): spread FR opt_time from this -> opt_time across seeds (0 = off)"
        default: "0"

jobs:
  route:
    # The runner you registered on your hardware must carry BOTH labels.
    runs-on: [self-hosted, cec-router]
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write      # the Notify step comments the verdict on the channel PR
      issues: write
    env:
      # Optional: set repo/org variable CEC_FREEROUTING_JAR to a local jar to skip the
      # one-time download. Otherwise cec_fr.ensure_jar() downloads the pinned v1.7.0.
      CEC_FREEROUTING_JAR: ${{ vars.CEC_FREEROUTING_JAR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- prerequisites ----
      - name: Verify prerequisites (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 (always present; pwsh/PS7 may not be). -ExecutionPolicy Bypass
        # so a fresh runner's default Restricted policy doesn't block the .ps1 (no machine config).
        shell: 'powershell -ExecutionPolicy Bypass -File "{0}"'
        run: .\scripts\route-prereqs.ps1

      - name: Verify prerequisites (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./scripts/route-prereqs.sh

      # ---- route on the runner's CPU ----
      - name: Route (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 (always present; pwsh/PS7 may not be). -ExecutionPolicy Bypass
        # so a fresh runner's default Restricted policy doesn't block the .ps1 (no machine config).
        shell: 'powershell -ExecutionPolicy Bypass -File "{0}"'
        run: >
          .\scripts\route.ps1
          -Board    "${{ inputs.board }}"
          -Seeds    "${{ inputs.seeds }}"
          -Passes    ${{ inputs.passes }}
          -OptTime   ${{ inputs.opt_time }}
          -Threads   ${{ inputs.threads }}
          -Kmax       ${{ inputs.kmax }}
          -MaxIters   ${{ inputs.max_iters }}
          -MaxWorkers ${{ inputs.max_workers }}
          -OptSpread  ${{ inputs.opt_spread }}
          -Out       "build/route/${{ inputs.board }}"
          -Render

      - name: Route (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/cec_router.py \
            --board     "${{ inputs.board }}" \
            --seeds     "${{ inputs.seeds }}" \
            --passes    "${{ inputs.passes }}" \
            --opt-time  "${{ inputs.opt_time }}" \
            --threads   "${{ inputs.threads }}" \
            --kmax        "${{ inputs.kmax }}" \
            --max-iters   "${{ inputs.max_iters }}" \
            --max-workers "${{ inputs.max_workers }}" \
            --opt-spread  "${{ inputs.opt_spread }}" \
            --out         "build/route/${{ inputs.board }}" \
            --render

      # ---- collect ----
      - name: Upload routed candidate + decision log + render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-${{ inputs.board }}-${{ github.run_id }}
          path: build/route/${{ inputs.board }}/
          if-no-files-found: warn

      # ---- ping: comment the verdict on the notifications channel PR (auto-ping a
      # subscribed Claude session the instant the run finishes). Targets the repo
      # Actions variable ROUTE_NOTIFY_PR (the channel PR; default 11). Uses a PAT
      # ROUTE_NOTIFY_TOKEN if set (GitHub can suppress webhooks for GITHUB_TOKEN
      # comments), else the built-in token. See docs/routing-notifications.md.
      - name: Notify (comment the verdict on the channel PR)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ROUTE_NOTIFY_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const board = process.env.BOARD;
            const pr = Number(process.env.NOTIFY_PR || '0');
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              const log = JSON.parse(fs.readFileSync(`build/route/${board}/${board}-decision-log.json`, 'utf8'));
              const f = log.final || {}; const v = f.verdict || {};
              body = `📡 **Route \`${board}\`** — [run ${context.runId}](${runUrl}) finished **${status}**\n\n`
                   + '```json\n' + JSON.stringify(v, null, 2) + '\n```\n'
                   + `elapsed ${f.elapsed_s ?? '?'}s · decisions ${f.decisions ?? '?'} · routed board + decision log + render in the run artifact.`;
            } catch (e) {
              body = `📡 **Route \`${board}\`** — [run ${context.runId}](${runUrl}) finished **${status}**, but no decision log was produced. Check the run logs.`;
            }
            if (pr > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
              core.info(`commented verdict on PR #${pr}`);
            } else {
              core.warning('ROUTE_NOTIFY_PR not set; skipping notification comment');
            }
        env:
          BOARD: ${{ inputs.board }}
          NOTIFY_PR: ${{ vars.ROUTE_NOTIFY_PR || '11' }}
          JOB_STATUS: ${{ job.status }}
