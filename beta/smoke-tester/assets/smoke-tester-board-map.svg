<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="monospace">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">SMOKE TESTER — physical board map + every connector (2026-07-24)</text>
  <text x="20" y="45" font-size="10.5" fill="#555">4 PCB designs in the box (2 permanent, 2 plug-in) + accessory adapter boards. One panelized 2-layer fab order covers all four.</text>

  <!-- enclosure outline -->
  <rect x="30" y="70" width="700" height="440" fill="none" stroke="#333" stroke-width="2" rx="8"/>
  <text x="40" y="88" font-size="10" fill="#555">ENCLOSURE (lid molds the starter kit; lid-open µswitch → K1 RESET)</text>

  <!-- faceplate -->
  <rect x="55" y="100" width="130" height="390" fill="#f0ead8" stroke="#8a6d00" stroke-width="2"/>
  <text x="63" y="120" font-size="11" font-weight="bold">BOARD 2</text>
  <text x="63" y="134" font-size="11" font-weight="bold">FACEPLATE</text>
  <text x="63" y="150" font-size="9">FR4, ZERO COPPER</text>
  <text x="63" y="162" font-size="9">in the fault path</text>
  <text x="63" y="178" font-size="9">apertures for:</text>
  <text x="63" y="190" font-size="9">· 8 ATO holders</text>
  <text x="63" y="202" font-size="9">· way lamps ×16</text>
  <text x="63" y="214" font-size="9">· 2 neon jewels</text>
  <text x="63" y="226" font-size="9">· meter cutout</text>
  <text x="63" y="238" font-size="9">· ARM/TEST/LOAD</text>
  <text x="63" y="250" font-size="9">· SW_SEL rotary</text>
  <text x="63" y="270" font-size="9" font-weight="bold">CONNECTOR: NONE</text>
  <text x="63" y="282" font-size="8.5">(parts live on MAIN,</text>
  <text x="63" y="293" font-size="8.5">poke through — silk</text>
  <text x="63" y="304" font-size="8.5">= truth table + QR)</text>

  <!-- main board -->
  <rect x="215" y="100" width="330" height="390" fill="#eaf0fd" stroke="#2255aa" stroke-width="2.5"/>
  <text x="225" y="120" font-size="11" font-weight="bold" fill="#2255aa">BOARD 1 — MAIN (permanent, 2-layer)</text>
  <text x="225" y="136" font-size="9">holders · comparators · lamps · K1 · switches</text>
  <text x="225" y="148" font-size="9">supercap store · dividers · HRC twist holders</text>
  <text x="225" y="160" font-size="9">300V-working creepage on all way copper</text>

  <!-- connectors on main -->
  <rect x="225" y="180" width="120" height="46" fill="#fff" stroke="#c22" stroke-width="1.5"/>
  <text x="231" y="196" font-size="9.5" font-weight="bold">J_SNOUT 2×13</text>
  <text x="231" y="208" font-size="8.5">keyed shrouded pair</text>
  <text x="231" y="219" font-size="8.5">24 DUT lines + 2 key</text>

  <rect x="225" y="240" width="120" height="46" fill="#fff" stroke="#c22" stroke-width="1.5"/>
  <text x="231" y="256" font-size="9.5" font-weight="bold">J_BRICK 2×10 skt</text>
  <text x="231" y="268" font-size="8.5">8 ways + 8 returns</text>
  <text x="231" y="279" font-size="8.5">+ harvest + 2 key</text>

  <rect x="225" y="300" width="120" height="40" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="231" y="316" font-size="9.5" font-weight="bold">J_AUX 2×5 keyed</text>
  <text x="231" y="328" font-size="8.5">3 exp-V ways + cont + GND</text>

  <rect x="225" y="352" width="120" height="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="231" y="366" font-size="9.5" font-weight="bold">J_PWR USB-C 5V</text>
  <text x="231" y="378" font-size="8.5">cold-start top-up only</text>

  <rect x="225" y="398" width="120" height="34" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="231" y="412" font-size="9.5" font-weight="bold">METER LUGS ×2</text>
  <text x="231" y="424" font-size="8.5">wire to 85C1 (panel)</text>

  <rect x="225" y="444" width="120" height="34" fill="#fff" stroke="#a8830a" stroke-width="1.5"/>
  <text x="231" y="458" font-size="9.5" font-weight="bold">EARTH STUD/LUG</text>
  <text x="231" y="470" font-size="8.5">rear pigtail (dec.#5)</text>

  <!-- brick plugged in -->
  <rect x="390" y="228" width="140" height="80" fill="#fdeaea" stroke="#c22" stroke-width="2.5"/>
  <text x="398" y="246" font-size="10" font-weight="bold" fill="#a11">BOARD 3 — BRICK</text>
  <text x="398" y="259" font-size="8.5">plug-in consumable ③</text>
  <text x="398" y="271" font-size="8.5">8 MOV + 8 witness</text>
  <text x="398" y="283" font-size="8.5">+ 33Ω harvest fusible</text>
  <text x="398" y="295" font-size="8.5">date-flag silk · keyed</text>
  <line x1="345" y1="263" x2="390" y2="263" stroke="#c22" stroke-width="2"/>

  <!-- snout plugged in -->
  <rect x="390" y="130" width="140" height="76" fill="#fdeaea" stroke="#c22" stroke-width="2.5"/>
  <text x="398" y="148" font-size="10" font-weight="bold" fill="#a11">BOARD 4 — SNOUT</text>
  <text x="398" y="161" font-size="8.5">plug-in DAMAGE spare ④</text>
  <text x="398" y="173" font-size="8.5">Mini-Fit Jr 24-ckt male</text>
  <text x="398" y="185" font-size="8.5">std tin (wear ruled</text>
  <text x="398" y="197" font-size="8.5">irrelevant at this duty)</text>
  <line x1="345" y1="203" x2="390" y2="168" stroke="#c22" stroke-width="2"/>

  <!-- DUT cable entering snout through enclosure -->
  <line x1="530" y1="150" x2="640" y2="150" stroke="#333" stroke-width="3"/>
  <rect x="640" y="128" width="80" height="44" fill="#f4f4f4" stroke="#333"/>
  <text x="648" y="146" font-size="9.5" font-weight="bold">DUT 24-pin</text>
  <text x="648" y="158" font-size="8.5">(front recess)</text>

  <!-- witness window -->
  <rect x="560" y="240" width="150" height="60" fill="#fff8f0" stroke="#a11" stroke-dasharray="4 3"/>
  <text x="568" y="258" font-size="9" font-weight="bold" fill="#a11">WITNESS WINDOW</text>
  <text x="568" y="270" font-size="8.5">polycarbonate over the</text>
  <text x="568" y="281" font-size="8.5">brick bay — the safe</text>
  <text x="568" y="292" font-size="8.5">smoke is visible ⌣</text>

  <!-- supercap + HRC service note -->
  <rect x="560" y="330" width="150" height="70" fill="#fff" stroke="#2255aa" stroke-dasharray="4 3"/>
  <text x="568" y="348" font-size="9" font-weight="bold" fill="#2255aa">INSIDE-LID SERVICE</text>
  <text x="568" y="361" font-size="8.5">HRC twist caps ×8</text>
  <text x="568" y="373" font-size="8.5">brick bay · starter kit</text>
  <text x="568" y="385" font-size="8.5">(door open ⇒ disarmed)</text>

  <!-- external accessories -->
  <rect x="760" y="100" width="200" height="180" fill="#f4fff4" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="770" y="120" font-size="10.5" font-weight="bold" fill="#1a7a1a">ACCESSORY BOARDS (external)</text>
  <text x="770" y="138" font-size="9">AUX adapters — passive,</text>
  <text x="770" y="150" font-size="9">one tiny PCB + plug each:</text>
  <text x="770" y="166" font-size="9">· SATA → J_AUX</text>
  <text x="770" y="178" font-size="9">· Molex → J_AUX</text>
  <text x="770" y="190" font-size="9">· PCIe 6+2 → J_AUX</text>
  <text x="770" y="202" font-size="9">· EPS 4+4 → J_AUX</text>
  <text x="770" y="220" font-size="8.5" fill="#555">$9–12 SKUs / $39 4-pack;</text>
  <text x="770" y="232" font-size="8.5" fill="#555">each carries its own pin map</text>
  <text x="770" y="244" font-size="8.5" fill="#555">(the box never grows</text>
  <text x="770" y="256" font-size="8.5" fill="#555">connectors)</text>

  <!-- fab note -->
  <rect x="760" y="300" width="200" height="130" fill="#fafafa" stroke="#999"/>
  <text x="770" y="320" font-size="10" font-weight="bold">FAB REALITY</text>
  <text x="770" y="336" font-size="8.5">ONE 2-layer JLC order,</text>
  <text x="770" y="348" font-size="8.5">panelized: MAIN + FACEPLATE</text>
  <text x="770" y="360" font-size="8.5">+ BRICK ×N + SNOUT ×N</text>
  <text x="770" y="372" font-size="8.5">(spares/consumable stock</text>
  <text x="770" y="384" font-size="8.5">ride the same panel free-ish)</text>
  <text x="770" y="402" font-size="8.5" fill="#555">4 designs ≠ 4 orders.</text>

  <!-- connector summary strip -->
  <rect x="30" y="530" width="930" height="78" fill="#fafafa" stroke="#999"/>
  <text x="40" y="550" font-size="10.5" font-weight="bold">CONNECTOR CENSUS (complete):</text>
  <text x="40" y="566" font-size="9">J_SNOUT 2×13 keyed shrouded (snout⇄main, all 24 DUT lines) · J_BRICK 2×10 keyed socket (brick⇄main, 8 ways/8 returns/harvest) · J_AUX 2×5 keyed (adapters)</text>
  <text x="40" y="580" font-size="9">J_PWR USB-C 5V (cold start) · meter lugs ×2 · earth stud (pigtail) · lid µswitch 2-wire · DUT side: the PSU's own 24-pin into the snout. FACEPLATE: no connector.</text>
  <text x="40" y="596" font-size="9" fill="#555">Nothing else crosses a board boundary — the whole fault path lives on MAIN + the two red plug-ins, which is the point.</text>
</svg>
