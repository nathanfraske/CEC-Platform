<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="monospace">
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">SMOKE TESTER — block diagram (beta, sketch-stage 2026-07-24)</text>
  <text x="20" y="46" font-size="11" fill="#555">Three domains, four socketed consumables (red ①–④). Rule: no main-board copper upstream of a sacrifice element.</text>

  <!-- DUT -->
  <rect x="20" y="70" width="120" height="90" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="100" font-size="13" font-weight="bold">SKETCHY</text>
  <text x="35" y="118" font-size="13" font-weight="bold">PSU (DUT)</text>
  <text x="30" y="140" font-size="10" fill="#555">24-pin cable</text>
  <line x1="140" y1="115" x2="185" y2="115" stroke="#333" stroke-width="3"/>

  <!-- SNOUT -->
  <rect x="185" y="80" width="90" height="70" fill="#fff" stroke="#c22" stroke-width="2"/>
  <text x="200" y="105" font-size="12" font-weight="bold">SNOUT ④</text>
  <text x="192" y="122" font-size="9.5">24-pin header</text>
  <text x="192" y="134" font-size="9.5">on paddle,</text>
  <text x="192" y="146" font-size="9.5">keyed hdr, ~$3</text>

  <!-- SACRIFICE PATH band -->
  <rect x="295" y="60" width="330" height="330" fill="#fdeaea" stroke="#c22" stroke-dasharray="6 3"/>
  <text x="305" y="78" font-size="12" font-weight="bold" fill="#a11">THE SACRIFICE PATH (DUT copper)</text>

  <!-- per-way chain -->
  <rect x="310" y="95" width="90" height="52" fill="#fff" stroke="#c22" stroke-width="2"/>
  <text x="318" y="115" font-size="11" font-weight="bold">ATO BLADE ①</text>
  <text x="318" y="129" font-size="9.5">1 A fast, panel</text>
  <text x="318" y="141" font-size="9.5">socket, $0.10</text>

  <line x1="400" y1="121" x2="425" y2="121" stroke="#333" stroke-width="2"/>
  <rect x="425" y="95" width="90" height="52" fill="#fff" stroke="#c22" stroke-width="2"/>
  <text x="433" y="112" font-size="11" font-weight="bold">HRC 5x20 ②</text>
  <text x="433" y="126" font-size="9.5">2 A T, 250VAC</text>
  <text x="433" y="138" font-size="9.5">sand-filled</text>
  <text x="433" y="150" font-size="8.5" fill="#555">internal twist holder</text>

  <line x1="515" y1="121" x2="540" y2="121" stroke="#333" stroke-width="2"/>
  <circle cx="546" cy="121" r="4" fill="#333"/>
  <text x="536" y="112" font-size="10" font-weight="bold">WAY NODE ×8</text>
  <line x1="546" y1="125" x2="546" y2="165" stroke="#333" stroke-width="2"/>

  <!-- BRICK -->
  <rect x="470" y="165" width="145" height="100" fill="#fff" stroke="#c22" stroke-width="2.5"/>
  <text x="480" y="185" font-size="12" font-weight="bold">SACRIFICE BRICK ③</text>
  <text x="480" y="201" font-size="9.5">8× MOV (S14K14/K6/K4)</text>
  <text x="480" y="214" font-size="9.5">8× 1Ω flameproof</text>
  <text x="480" y="226" font-size="9.5">   fusible WITNESS</text>
  <text x="480" y="240" font-size="9.5">keyed 2×10 socket, ~$3</text>
  <text x="480" y="256" font-size="9" fill="#a11">OV/mains → conducts hard →</text>
  <text x="480" y="266" font-size="9" fill="#a11">fuses clear, witness smokes</text>

  <!-- bleeder -->
  <rect x="310" y="185" width="130" height="58" fill="#fff" stroke="#333"/>
  <text x="320" y="205" font-size="10.5" font-weight="bold">MIN-LOAD BLEEDERS</text>
  <text x="320" y="219" font-size="9.5">47Ω 10W (12V) ~0.26A</text>
  <text x="320" y="231" font-size="9.5">10Ω 5W (5V) ~0.5A, switched</text>
  <line x1="546" y1="165" x2="546" y2="150"/>
  <line x1="470" y1="214" x2="440" y2="214" stroke="#333" stroke-width="1.5"/>

  <!-- ways fanout note -->
  <text x="310" y="290" font-size="10" fill="#333">Ways: 12V · 5V · 3V3 · 5VSB · −12V  +  AUX-12 · AUX-5 · AUX-3V3 (fused)  +  AUX-GND (1kΩ 350V continuity lamp)</text>
  <text x="310" y="306" font-size="10" fill="#333">Signals (no fuse, high-Z): PS_ON# ← relay·100Ω·PESD    PWR_OK → 1kΩ·PESD → race</text>

  <!-- AUX -->
  <rect x="310" y="325" width="300" height="52" fill="#fff" stroke="#333"/>
  <text x="320" y="344" font-size="11" font-weight="bold">AUX ADAPTER PORT (keyed 2×5)</text>
  <text x="320" y="358" font-size="9.5">passive SATA/Molex/PCIe/EPS adapters map pins → expected-V ways;</text>
  <text x="320" y="370" font-size="9.5">miswired modular cable ⇒ 12V lands on 5V-way ⇒ RED. Accessory SKUs.</text>

  <!-- MEASUREMENT DOMAIN -->
  <rect x="645" y="60" width="315" height="330" fill="#eaf0fd" stroke="#2255aa" stroke-dasharray="6 3"/>
  <text x="655" y="78" font-size="12" font-weight="bold" fill="#2255aa">FLOATING MEASUREMENT DOMAIN</text>
  <text x="655" y="92" font-size="9.5" fill="#2255aa">BATTERYLESS: 2S supercap store, self-charged off the DUT (5VSB/5V harvest) + USB-C top-up · rides DUT GND</text>

  <line x1="615" y1="121" x2="700" y2="121" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="700" y="100" width="115" height="60" fill="#fff" stroke="#2255aa"/>
  <text x="708" y="118" font-size="10.5" font-weight="bold">DIVIDERS ≥900k</text>
  <text x="708" y="132" font-size="9.5">3×301k series 1206</text>
  <text x="708" y="144" font-size="9.5">(300V-rated string)</text>
  <text x="708" y="156" font-size="9.5">tap ÷10 · −12V bias</text>

  <line x1="815" y1="130" x2="845" y2="130" stroke="#333" stroke-width="1.5"/>
  <rect x="845" y="100" width="105" height="60" fill="#fff" stroke="#2255aa"/>
  <text x="853" y="118" font-size="10.5" font-weight="bold">4× LM339</text>
  <text x="853" y="132" font-size="9.5">±5% windows vs</text>
  <text x="853" y="144" font-size="9.5">TL431 ladder</text>
  <text x="853" y="156" font-size="9.5">+ PG timing race</text>

  <rect x="700" y="185" width="250" height="70" fill="#fff" stroke="#2255aa"/>
  <text x="710" y="204" font-size="10.5" font-weight="bold">LAMPS (per way grn/red) + BLOWN-FUSE</text>
  <text x="710" y="218" font-size="9.5">indicators across every blade (lights when</text>
  <text x="710" y="230" font-size="9.5">fuse open AND way live) · PG EARLY/OK/LATE</text>
  <text x="710" y="246" font-size="9.5" fill="#555">panel silk = verdict truth-table</text>

  <rect x="700" y="270" width="250" height="60" fill="#fff" stroke="#2255aa"/>
  <text x="710" y="289" font-size="10.5" font-weight="bold">NEEDLE METER (85C1, 100µA) + 1P6T</text>
  <text x="710" y="303" font-size="9.5">reads the DIVIDED node only (never sees</text>
  <text x="710" y="315" font-size="9.5">more than a few volts) · scale ×10 · no pixels</text>

  <!-- CONTROLS -->
  <rect x="645" y="405" width="315" height="105" fill="#eafbea" stroke="#1a7a1a" stroke-dasharray="6 3"/>
  <text x="655" y="423" font-size="12" font-weight="bold" fill="#1a7a1a">HUMAN CONTROLS</text>
  <text x="655" y="440" font-size="9.5">missile-cover ARM → RC pulse → K1 latching DPDT (SET)</text>
  <text x="655" y="454" font-size="9.5">lid-open µswitch / DISARM → K1 RESET  (open door = safe)</text>
  <text x="655" y="468" font-size="9.5">K1-A: PS_ON# → GND via 100Ω + PESD (finger never meets DUT)</text>
  <text x="655" y="482" font-size="9.5">K1-B: starts the PWR_OK 100/500ms analog race</text>
  <text x="655" y="499" font-size="9.5">TEST momentary powers comparator domain (multimeter economy)</text>

  <!-- EARTH DOMAIN -->
  <rect x="20" y="405" width="605" height="105" fill="#fdf7e2" stroke="#a8830a" stroke-dasharray="6 3"/>
  <text x="30" y="423" font-size="12" font-weight="bold" fill="#8a6d00">EARTH-NEON DOMAIN (no powered electronics at all)</text>
  <text x="30" y="441" font-size="9.5">DUT-GND —470k—470k— NE-2 — EARTH ref  ⇒  ◉ CASE LIVE   (strikes ~90V)</text>
  <text x="30" y="456" font-size="9.5">ways OR (4×1MΩ) — NE-2 — EARTH ref     ⇒  ◉ RAIL LIVE</text>
  <text x="30" y="472" font-size="9.5">earth ref = rear pigtail or earth-only IEC inlet (open decision #5)</text>
  <text x="30" y="492" font-size="10" font-weight="bold" fill="#a11">Lights BEFORE anyone touches the case. The fuses protect the box; this protects the human.</text>

  <!-- legend -->
  <rect x="20" y="530" width="940" height="90" fill="#fafafa" stroke="#999"/>
  <text x="30" y="549" font-size="10.5" font-weight="bold">CONSUMABLES (all socketed; starter kit in the lid ships blades + 2 HRC + 1 spare brick):</text>
  <text x="30" y="565" font-size="9.5">① ATO blade 1A — hardware-store standard ON PURPOSE (trust story) · ② HRC 2A-T 250VAC — the only element rated to break mains</text>
  <text x="30" y="579" font-size="9.5">③ sacrifice brick — every part that absorbs a fault, one $3 swap, date-flag silk · ④ snout — the mating-wear item (~30 cycles/tin Mini-Fit)</text>
  <text x="30" y="597" font-size="9.5" fill="#555">Coordination: blade clears LV events (1A F); a mains arc rides through to the HRC (2A T, sand) which breaks it; the witness 1Ω smokes benignly</text>
  <text x="30" y="610" font-size="9.5" fill="#555">and disconnects its spent MOV. Fences: terminator-only · lamps not numbers · the bouncer, not the interview.</text>
</svg>
