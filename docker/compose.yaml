    volumes:
      - "/mnt/e/AI Models:/models:ro"
    command:
      - "-m"
      - "/models/Qwythos-9B-1M-MTP-Q4_K_M.gguf"
      - "--alias"
      - "qwythos-mtp-q4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8020"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "32768"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qwythos-mtp-q8:
    profiles: ["qwythos-mtp-q8"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
