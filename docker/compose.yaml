# ----------------------------------------------------------------------------------------------
# CEC compute plane -- Linux container home (Phase 0 of docs/local-compute-exploration.md).
#
# Services share ONE passed-through RTX 5090 (the card is not MIG-capable -> at most one heavy GPU
# job at a time; share via MPS/time-slicing if needed). The split is deliberate:
#   * routing    -- CPU: Freerouting JVM swarm + kicad-cli DRC (the actual throughput engine).
#   * freerouting-- the CEC fork REST service (cec_fr_server.py wrapping OUR pinned 1.7.0-cec2 jar).
#   * inference  -- GPU, OPT-IN (profile): one batched vLLM server for the local judge tiers.
#   * fem        -- GPU/CPU, OPT-IN (profile): placeholder for the Elmer/openEMS tier (Phase 2/3).
#
# IMPORTANT: run this with the repo on the WSL2 ext4 home (~/), NOT on /mnt/c -- the DSN/SES round
# trip is many-small-file churn that is dramatically slower over the /mnt/c 9P mount.
#
# Quickstart:
#   docker compose -f docker/compose.yaml build routing
#   docker compose -f docker/compose.yaml up -d freerouting routing
#   docker compose -f docker/compose.yaml run --rm routing \
#       python3 scripts/cec_router.py --board eps-8pin --seeds 0,1,2,3 --passes 12 --opt-time 30
#   # opt-in GPU inference for the local judge tiers:
#   docker compose -f docker/compose.yaml --profile inference up -d inference
# ----------------------------------------------------------------------------------------------

services:
  # CPU compute plane: the cec_* pipeline (Freerouting JVMs + kicad-cli DRC). No GPU.
  routing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.routing
      args:
        KICAD_IMAGE: ${KICAD_IMAGE:-kicad/kicad:10.0}   # keep in sync with versions.env
    image: cec/routing:kicad10
    init: true                              # tini as PID 1 -> reaps any orphaned Xvfb/JVM children
    working_dir: /workspace
    volumes:
      - ..:/workspace                       # the repo (keep it on the WSL ext4 home, not /mnt/c)
      - cec-cache:/root/.cache/cec          # persist the downloaded Freerouting 1.7.0 jar
      - ../../cec-runs:/cec-runs            # SB-01: the sibling run-ledger repo (ledger.jsonl)
    environment:
      # SB-01: where cec_ledger appends run lines (the sibling cec-runs repo mounted above)
      - CEC_RUNS_DIR=/cec-runs
      # cec_fr routes through the CEC fork REST service (LIVE 2026-07-22; CEC_FR_REST=0 opts out,
      # and an unreachable service falls back to the local jar loudly):
      - CEC_FREEROUTING_URL=http://freerouting:37864
      # The local LLM judge tier goes through the cec-llm-broker on the HOST (:8080), which serializes
      # GPU access against the other LLM project on this box and routes by model name (cec-judge -> the
      # `inference` vLLM :8000 published on the host). host.docker.internal -> host via the extra_hosts
      # gateway below. Fail-fast: broker down -> connection-refused -> the judge's deterministic fallback.
      - CEC_VLLM_URL=http://host.docker.internal:8080/v1
      # The repo is a host-owned bind mount read by root-in-container: git >=2.35 refuses it as
      # 'dubious ownership' (breaks cec_pcb_reconcile / ledger git calls after any container
      # recreate). GIT_CONFIG_* env is user/home-independent, unlike an exec'd `git config`.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - freerouting
    command: ["sleep", "infinity"]          # stay alive; exec in or use `compose run`

  # The CEC Freerouting REST service (scripts/cec_fr_server.py) -- OUR fork jar behind a thin
  # job API (owner directive 2026-07-22: the REST path serves the custom cec jar with the vital
  # corrections, NOT the official freerouting 2.x API image). Each job executes
  # cec_fr.run_freerouting itself (hash-pinned 1.7.0-cec2 fork, seed axis, noecho, maxstall,
  # plateau-kill, xvfb + tree-kill all identical to the local path), so REST-vs-local is an
  # infrastructure choice, not an epoch change. cec_fr reads CEC_FREEROUTING_URL (set on the
  # routing service above) and falls back to the local jar loudly if this service is down.
  # CEC_FR_SERVER_WORKERS is the box-wide FR concurrency governor (the measured "never exceed
  # ~6 concurrent FRs on 18 cores" rule now lives HERE, not in per-chain worker counts).
  # HISTORY: until 2026-07-22 this service ran ghcr.io/freerouting/freerouting (v2.2.4 official
  # API image) -- retired: different router (measured 12vhpwr GND normalize-hang, no seed axis),
  # its API binds 127.0.0.1 inside its netns as shipped (fix was --api_server-endpoints=
  # http://0.0.0.0:37864), and it requires freerouting.app API keys + EDA-tool headers. The
  # 2.2.4 app-image stays reachable for FR-01 epoch benches via FR_RELEASES, not through REST.
  freerouting:
    image: cec/routing:kicad10                # same image as `routing` (java + xvfb + repo deps)
    working_dir: /workspace
    command: ["python3", "scripts/cec_fr_server.py", "--host", "0.0.0.0",
              "--port", "37864", "--data", "/mnt/freerouting/jobs"]
    environment:
      - CEC_FR_SERVER_WORKERS=6
    ports:
      - "37864:37864"
    volumes:
      - ..:/workspace                         # repo: the fork jar (build/fr-fork) + scripts
      - cec-cache:/root/.cache/cec            # shared jar cache with `routing`
      - fr-data:/mnt/freerouting              # job store (dsn/ses/logs per job)
    restart: unless-stopped

  # GPU local-inference server for the control-plane judge tiers (Thrust A). OPT-IN.
  # vLLM image ships torch 2.11/cu13 -> verified to run on Blackwell sm_120 (cap 12.0) in WSL2.
  # AWQ model (FP8/FP4 is not yet usefully exposed through WSL2 dxgkrnl). The default is a community
  # AWQ of the MoE Qwen3-Coder-30B-A3B (3B active -> fast) -- the official Qwen ...-AWQ repo is gated
  # (401), so cpatonn's public AWQ is the working pick (verified 200). --served-model-name gives a
  # stable alias cec_router targets; --enforce-eager skips CUDA-graph capture (the Blackwell/WSL2
  # fragile path -- drop it for ~throughput once WSL >= 2.7.0 graph fix is confirmed).
  inference:
    profiles: ["inference"]
    image: ${CEC_VLLM_IMAGE:-vllm/vllm-openai:latest}
    ipc: host                              # vLLM needs a large /dev/shm for NCCL/tensor sharing
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1        # faster model download
    command:
      - "--model"
      - "${CEC_VLLM_MODEL:-cpatonn/Qwen3-Coder-30B-A3B-Instruct-AWQ}"
      - "--served-model-name"
      - "cec-judge"
      - "--gpu-memory-utilization"
      - "${CEC_VLLM_GPU_FRACTION:-0.85}"
      - "--max-model-len"
      - "${CEC_VLLM_MAX_LEN:-32768}"
      - "--enforce-eager"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # (The old `manager` service -- the Qwen3-235B-A22B-Thinking :8001 "experts in RAM, attention on
  # the 5090" split -- was REMOVED 2026-06-10: the 235B was retired 2026-06-09 and its model files
  # deleted, so the service could only crash-loop. Its measured offload findings are preserved in
  # CLAUDE.md; the n-cpu-moe pattern lives on in manager-m27/manager-fast below. cec-manager now
  # resolves to manager-m27 via the broker registry.)

  # ---- 2026-06-09 model-store refresh: new GGUFs live on E:\AI Models (the WSL
  # drvfs mount /mnt/e/AI Models -- big & roomy, but slower I/O than ext4, so cold
  # loads take minutes; the broker's 30-min idle reaper keeps a hot model warm).
  # All three are llama.cpp; the broker (cec-llm-broker :8080) starts/stops these
  # on demand by registry entry -- do NOT compose up/down by hand.

  # VOLUME worker -- Qwen3.6-35B-A3B UD-Q4_K_M (MoE, 3B active): the high-throughput
  # swarm tier. Fully on the 5090 (22.1 GB weights), 4 parallel slots.
  worker-volume:
    profiles: ["worker-volume"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8002:8002"
    volumes:
      - "/mnt/e/AI Models/qwen3.6-35b-a3b:/models:ro"
    command:
      - "-m"
      - "/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
      - "--alias"
      - "cec-worker"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8002"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "${CEC_WORKER_CTX:-32768}"           # shared across slots (-np 4 -> 8k each)
      - "-np"
      - "${CEC_WORKER_SLOTS:-4}"             # the throughput knob (cont. batching)
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # QUALITY worker -- Qwen3.6-27B dense Q4_K_M: swapped in over the volume worker
  # when a call wants maximum per-call quality rather than throughput. Fully on GPU.
  worker-quality:
    profiles: ["worker-quality"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8004:8004"
    volumes:
      - "/mnt/e/AI Models/qwen3.6-27b:/models:ro"
    command:
      - "-m"
      - "/models/Qwen3.6-27B-Q4_K_M.gguf"
      - "--alias"
      - "cec-worker-quality"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8004"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "${CEC_WORKERQ_CTX:-32768}"
      - "-np"
      - "${CEC_WORKERQ_SLOTS:-2}"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- 2026-06-10 VISION tier (CL-22 local seats; parity plan §6) -------------
  # Qwen3-VL-32B-Instruct = the grounding-proven JUDGE (RefCOCO-trained; 19.8 GB
  # weights + 1.2 GB mmproj, fully in VRAM). The two text workers gain eyes via
  # their mmproj files as SEPARATE services on their own ports/profiles, so the
  # benched text entries stay untouched. All single-slot, ctx 16k (image
  # embeddings are token-heavy; the bake-off/panel path is serial). Broker
  # arbitration: only one vision backend fits the 5090 at a time -- registry
  # vram_gb entries make it swap. Binding into any panel SEAT is gated on the
  # CL-22 golden-render eval (pre-fix fixtures fire, post-fix stay quiet).
  vision-judge:
    profiles: ["vision-judge"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8006:8006"
    volumes:
      - "/mnt/e/AI Models/qwen3-vl-32b:/models:ro"
    command:
      - "-m"
      - "/models/Qwen3VL-32B-Instruct-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-Qwen3VL-32B-Instruct-F16.gguf"
      - "--alias"
      - "cec-vision-judge"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "${CEC_VISION_CTX:-16384}"
      - "-np"
      - "1"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-volume-vision:
    profiles: ["worker-volume-vision"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8012:8012"
    # The llama.cpp image ships a built-in HEALTHCHECK hardcoded to :8080, but this service runs on
    # :8012 (every CEC service overrides --port), so the inherited check ALWAYS fails -> perpetual
    # Docker "unhealthy". Override it to the real port. start_period rides the ~8-min drvfs cold load
    # (/mnt/e is the Windows drive over WSL2 drvfs, ~47 MB/s) without flapping. The broker uses its
    # own probe regardless; this just makes `docker ps` status truthful.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    volumes:
      - "/mnt/e/AI Models/qwen3.6-35b-a3b:/models:ro"
    command:
      - "-m"
      - "/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-F16.gguf"
      - "--alias"
      - "cec-worker-vision"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8012"
      - "-ngl"
      - "99"
      # EXPERTS-IN-RAM (2026-06-13, owner directive to run fullstack + V4 together): with DeepSeek-
      # V4-Flash resident on the 5090 (~13 GiB), the all-GPU worker (np1 = 24.3 GiB) OOMs the 32 GiB
      # card (13+24 > 32). --n-cpu-moe moves the MoE experts to host RAM so the worker's GPU footprint
      # drops to ~8-10 GiB (fits beside V4); the ~18 GiB of experts join host RAM (the RAM-tight
      # tradeoff the owner accepted). Set CEC_VISION_NCPUMOE=0 to revert to all-GPU when V4 is unloaded.
      - "--n-cpu-moe"
      - "${CEC_VISION_NCPUMOE:-99}"
      # Unified text+vision seat (2026-06-11): one resident backend serves BOTH the text seats
      # (T1/T4/verifier) and the vision seat (T6), deleting the per-round worker<->vision swap.
      # -np 1 is correct and SAFE here: cec_fullstack issues every seat call SERIALLY (worker_panel
      # and verifier.verify() are both for-loops -- no concurrent worker calls within a round).
      # MEASURED on the 32 GiB 5090: np1 = ~24.3 GiB resident / ~8 GiB free; np4 = ~31.7 GiB / <1 GiB
      # free (UNSAFE, and unused by the serial pipeline -- the +7.4 GiB is KV for slots nothing fills,
      # and it does NOT shrink with --ctx-size). Only raise CEC_VISION_NP if you first parallelize the
      # panel/verifier in code, and even then cap at 2 for headroom.
      # CTX HEADROOM (measured 2026-06-12, prompt_tokens): widest worker-seat text prompt = 652 tok
      # (verifier w/ the widened pour+FEM bundle), vision call = 384 tok (small model-free render) ->
      # 15732 free of 16384 (96%). The image is NOT token-heavy; 16384 is ample, no bump needed.
      - "--ctx-size"
      - "${CEC_VISION_CTX:-16384}"
      - "-np"
      - "${CEC_VISION_NP:-1}"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-quality-vision:
    profiles: ["worker-quality-vision"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8014:8014"
    volumes:
      - "/mnt/e/AI Models/qwen3.6-27b:/models:ro"
    command:
      - "-m"
      - "/models/Qwen3.6-27B-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-F16.gguf"
      - "--alias"
      - "cec-worker-quality-vision"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8014"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "${CEC_VISION_CTX:-16384}"
      - "-np"
      - "1"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MANAGER (new) -- MiniMax-M2.7 229B-A10B, UD-Q3_K_XL by default (102 GB, 4-part
  # split GGUF; llama.cpp loads part 00001 and finds the rest). Path-C decision
  # (2026-06-09): Q3_K_XL FITS FULLY in the 122 GiB page cache, so after one cold
  # load there is NO steady-state paging from the slow drvfs mount -- the Q4_K_XL
  # (141 GB > RAM) measured 3.7 tok/s because ~20 GB of experts rotated through 9p,
  # and its loose copy was retired for space. Quant swaps: set CEC_M27_DIR +
  # CEC_M27_FILE (no compose edit). llama.cpp's auto-fit picks the GPU/CPU split;
  # CEC_M27_NCPUMOE remains the manual override. Served alias stays "cec-manager"
  # so every manager-tier client is unchanged.
  manager-m27:
    profiles: ["manager-m27"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8003:8003"
    volumes:
      - "${CEC_M27_DIR:-/mnt/e/AI Models/minimax-m2.7-ud-q3kxl}:/models:ro"
    command:
      - "-m"
      - "/models/${CEC_M27_FILE:-MiniMax-M2.7-UD-Q3_K_XL-00001-of-00004.gguf}"
      - "--alias"
      - "cec-manager"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8003"
      - "-ngl"
      - "99"
      - "--n-cpu-moe"
      - "${CEC_M27_NCPUMOE:-56}"
      - "--ctx-size"
      - "${CEC_M27_CTX:-16384}"
      - "-fa"
      - "auto"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # FAST manager -- gpt-oss-120b MXFP4 (117B MoE, 5.1B active, 63.4 GB split GGUF):
  # manager-class judgment at several-x the MiniMax/235B decode speed. Experts all in
  # RAM (~58 GB of 122 GiB -- comfortable), attention/KV on the 5090. Registry name
  # cec-manager-fast; use it when manager-quality reasoning is wanted without the
  # deep-model latency.
  manager-fast:
    profiles: ["manager-fast"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
      - "8005:8005"
    volumes:
      - "/mnt/e/AI Models/gpt-oss-120b:/models:ro"
    command:
      - "-m"
      - "/models/gpt-oss-120b-mxfp4-00001-of-00003.gguf"
      - "--alias"
      - "cec-manager-fast"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8005"
      - "-ngl"
      - "99"
      - "--n-cpu-moe"
      - "${CEC_OSS_NCPUMOE:-99}"             # all experts in RAM (fits easily)
      - "--ctx-size"
      - "${CEC_OSS_CTX:-16384}"
      - "-fa"
      - "auto"
      - "--jinja"                            # gpt-oss harmony chat template
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Placeholder for the physics tier (Elmer / openEMS via gerber2ems). Filled in Phase 2/3.
  # fem:
  #   profiles: ["fem"]
  #   build: { context: .., dockerfile: docker/Dockerfile.fem }
  #   volumes: [ "..:/workspace" ]

  # ---- 2026-07-13 Qwythos + Q36-35B test models (wired by the manager; benchmark sweep pending) ----
  qwythos-mtp-q4:
    profiles: ["qwythos-mtp-q4"]
    image: ${CEC_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    ipc: host
    ports:
