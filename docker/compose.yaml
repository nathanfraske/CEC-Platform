    command:
      - "-m"
      - "/models/Qwen3.6-35B-A3B-ResearchHHQ-Aggressive-Q4_K_P.gguf"
      - "--alias"
      - "q36-35b-aggr"
      - "--host"
      - "0.0.0.0"
